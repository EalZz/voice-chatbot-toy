services:
  ollama-server:
    image: ollama/ollama
    container_name: ollama-server
    restart: always
    volumes:
      - ollama_storage:/root/.ollama
      - ./models:/app/models
    ports:
      - "11434:11434"
    networks:
      - voice-net

  db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: voice_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - voice-net

  voice-backend:
    build: ./backend
    image: ealz/voice-backend:v5
    container_name: voice-backend
    restart: always
    environment:
      - OLLAMA_HOST=ollama-server
      - DATABASE_URL=postgresql://user:password@db:5432/voice_db
    depends_on:
      - ollama-server
      - db
    ports:
      - "8000:8000"
    networks:
      - voice-net

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "18888:8080"
    restart: unless-stopped
    networks:
      - voice-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: "0"
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped
    networks:
      - voice-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - voice-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://user:password@db:5432/voice_db?sslmode=disable
    ports:
      - "9187:9187"
    restart: unless-stopped
    networks:
      - voice-net

volumes:
  ollama_storage:
  postgres_data:  # 데이터 영속성을 위해 명시적 선언 권장

networks:
  voice-net:
    driver: bridge
